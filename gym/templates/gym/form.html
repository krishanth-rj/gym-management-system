{% extends 'gym/base.html' %}{% block title %}{{ title }}{% endblock %}{% block content %}<section class="form-card"><h2>{{ title }}</h2><form method="post">{% csrf_token %}{% for field in form %}<div class="field{% if field.name == 'description' %} wide{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.errors %}<small class="error">{{ field.errors|striptags }}</small>{% endif %}</div>{% endfor %}<div class="form-actions"><a href="javascript:history.back()">Cancel</a><button class="btn">Save</button></div></form></section>{% endblock %}
